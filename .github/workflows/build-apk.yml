name: build-apk
on:
  workflow_dispatch:
    inputs:
      abi:
        description: Arquitetura (arm64-v8a para quase todo celular)
        type: choice
        default: arm64-v8a
        options: [arm64-v8a, armeabi-v7a, x86, x86_64, todas]
permissions:
  contents: read
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          all='[{"abi":"arm64-v8a","target":"aarch64-linux-android"},{"abi":"armeabi-v7a","target":"armv7-linux-androideabi"},{"abi":"x86","target":"i686-linux-android"},{"abi":"x86_64","target":"x86_64-linux-android"}]'
          if [ "$ABI" = "todas" ]; then m="$all"; else m=$(echo "$all" | jq -c --arg a "$ABI" 'map(select(.abi==$a))'); fi
          echo "matrix={\"include\":$m}" >> "$GITHUB_OUTPUT"
  apk:
    needs: pick
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pick.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Extrair os zips do projeto
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          shopt -s nullglob
          zips=(*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "Nenhum .zip na raiz do repositorio. Envie os zips do projeto."; exit 1; }
          for z in "${zips[@]}"; do echo "Extraindo $z"; unzip -q -o "$z" -d "$RUNNER_TEMP/proj"; done
          for i in 1 2; do
            find "$RUNNER_TEMP/proj" -name '*parte*.zip' -print0 | while IFS= read -r -d '' z; do
              unzip -q -o "$z" -d "$(dirname "$z")" && rm "$z"
            done
          done
          script=$(find "$RUNNER_TEMP/proj" -path '*/packaging/android/build_apk.py' | head -1)
          [ -n "$script" ] || { echo "build_apk.py nao encontrado: faltam partes do projeto?"; exit 1; }
          src=$(dirname "$(dirname "$(dirname "$script")")")
          echo "SRC=$src" >> "$GITHUB_ENV"
          test -f "$src/Cargo.toml" || { echo "Cargo.toml nao encontrado em $src"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Instalar SDK e NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Instalar Rust e cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Compilar o APK
        working-directory: ${{ env.SRC }}
        run: python packaging/android/build_apk.py --abi "${{ matrix.abi }}" --profile quick --preview
      - name: Nomear o APK
        working-directory: ${{ env.SRC }}/target/android
        run: |
          apk=$(ls starling-*.apk | head -1)
          cp "$apk" "Cat-Launcher-${{ matrix.abi }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Cat-Launcher-apk-${{ matrix.abi }}
          path: ${{ env.SRC }}/target/android/Cat-Launcher-*.apk
          if-no-files-found: error
          retention-days: 30
          
